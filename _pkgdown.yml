url: https://emanuelsoda.github.io/ScreenR/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#1F5F55"
    secondary: "#C9836A"
    link-color: "#1F5F55"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
    border-radius: 0.75rem
    font-size-base: 1rem
    # The floating glass navbar is taller than the default one
    pkgdown-nav-height: 88px
  # pkgdown/extra.css and pkgdown/extra.js add the glass design
  opengraph:
    image:
      src: man/figures/card.png
      alt: "ScreenR: hit identification in pooled shRNA and CRISPR-Cas9 screens"

home:
  title: "ScreenR: hit identification in pooled shRNA and CRISPR-Cas9 screens"
  description: >
    Find the genes that matter in pooled shRNA and CRISPR-Cas9 screens with
    calibrated statistics, quality control and publication-ready plots.
  sidebar:
    structure: [links, license, community, citation, authors, dev]
  links:
  - text: Bioconductor page
    href: https://bioconductor.org/packages/ScreenR
  - text: Ask a question (Bioconductor support)
    href: https://support.bioconductor.org/tag/ScreenR

navbar:
  structure:
    left:  [intro, tutorials, articles, reference, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Get started
      href: articles/Tutorial_1_Creating_the_object.html
    tutorials:
      text: Tutorials
      menu:
      - text: "1. Getting your data into ScreenR"
        href: articles/Tutorial_1_Creating_the_object.html
      - text: "2. Quality control"
        href: articles/Tutorial_2_Quality_control.html
      - text: "3. Finding and validating hits"
        href: articles/Tutorial_3_Finding_hits.html
      - text: "4. CRISPR-Cas9 screens"
        href: articles/Tutorial_4_CRISPR_screens.html
      - text: "5. The ScreenR app (no code)"
        href: articles/Tutorial_5_ScreenR_app.html
    articles:
      text: Articles
      menu:
      - text: Complete analysis example
        href: articles/Analysis_Example.html
      - text: Statistics in ScreenR
        href: articles/Improved_Statistics.html
      - text: Choosing the reference of the gene-level test
        href: articles/Empirical_null.html
      - text: The mixture empirical null on a CRISPR-Cas9 dropout screen
        href: articles/Mixture_null_CRISPR.html
      - text: Analysis of a longitudinal screen
        href: articles/Longitudinal_Screen_Analysis.html
      - text: Benchmark against MAGeCK and other tools
        href: articles/Benchmark_MAGeCK.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/EmanuelSoda/ScreenR
      aria-label: GitHub

articles:
- title: Tutorials
  desc: Step-by-step guides, from the count table to the list of hits.
  contents:
  - Tutorial_1_Creating_the_object
  - Tutorial_2_Quality_control
  - Tutorial_3_Finding_hits
  - Tutorial_4_CRISPR_screens
  - Tutorial_5_ScreenR_app
- title: Articles
  contents:
  - Analysis_Example
  - Improved_Statistics
  - Empirical_null
  - Mixture_null_CRISPR
  - Longitudinal_Screen_Analysis
  - Benchmark_MAGeCK

reference:
- title: Create the ScreenR object
  desc: >
    Build the object from a count table and a barcode annotation, and update
    objects saved with older versions of ScreenR.
  contents:
  - create_screenr_object
  - '`screenr_object-class`'
  - '`screenr_object-replace`'
  - update_screenr_object
  - remove_all_zero_row
  - '`show,screenr_object-method`'
  - '`[,screenr_object,ANY,ANY,ANY-method`'

- title: Access and modify the object
  desc: Getter and setter functions for the content of the ScreenR object.
  contents:
  - starts_with("get_")
  - starts_with("set_")

- title: Quality control
  desc: Check the sequencing depth, the library representation and the replicates.
  contents:
  - count_mapped_reads
  - mapped_reads
  - plot_mapped_reads
  - plot_mapped_reads_distribution
  - barcode_lost
  - plot_barcode_lost
  - plot_barcode_lost_for_gene
  - compute_gini
  - plot_gini
  - plot_replicate_correlation
  - plot_mds
  - plot_pca
  - compute_explained_variance
  - plot_explained_variance
  - plot_boxplot

- title: Normalization and barcode statistics
  desc: Normalize the counts and compute barcode-level fold changes and scores.
  contents:
  - normalize_data
  - compute_data_table
  - compute_metrics
  - compute_barcode_statistics
  - create_design_matrix
  - create_contrast
  - create_edger_obj

- title: Find hits
  desc: >
    Gene-level tests that return a p-value and a false discovery rate for
    every gene.
  contents:
  - find_gene_zscore_hit
  - plot_empirical_null
  - find_camera_hit
  - find_roast_hit
  - find_consistent_hit
  - combine_consistent_hits
  - find_time_hit

- title: Combine and validate hits
  desc: Compare the methods and check the hits at the barcode level.
  contents:
  - summarise_hits
  - plot_volcano
  - find_common_hit
  - plot_common_hit
  - find_discordant_barcodes
  - plot_barcode_hit
  - plot_barcode_trend
  - plot_trend
  - plot_treatment_separation
  - plot_barcode_heatmap
  - plot_zscore_distribution
  - filter_by_slope
  - filter_by_variance
  - compute_slope

- title: CRISPR screens and reference genes
  desc: >
    Choose the barcode thresholds for the library, check the screen with
    essential and non-essential reference genes, and correct CRISPR-Cas9
    copy-number bias with CRISPRcleanR.
  contents:
  - barcodes_per_gene
  - compute_screen_quality
  - plot_reference_separation
  - scale_by_reference
  - correct_crispr_bias
  - crisprcleanr_available
  - hart_reference_genes

- title: Interactive app
  desc: >
    Analyse a screen in the browser, without writing code.
  contents:
  - run_screenr_app

- title: Legacy hit rules
  desc: >
    Rules of earlier versions of ScreenR, kept for compatibility. They do not
    control the false discovery rate; use the tests above to call hits.
  contents:
  - find_zscore_hit
  - find_robust_zscore_hit

- title: Datasets
  desc: >
    Example screen, a published K562 shRNA screen and a HAP1 CRISPR-Cas9
    screen with known essential genes.
  contents:
  - count_table
  - annotation_table
  - k562_count_table
  - k562_annotation_table
  - k562_reference_genes
  - hap1_count_table
  - hap1_annotation_table

- title: Package
  contents:
  - '`ScreenR-package`'
